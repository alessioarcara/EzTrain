[project]
name = "eztrainer"
version = "0.1.0"
description = "Small, framework-agnostic training-loop library. The trainer companion to EzConfy."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Alessio Arcara" }]
keywords = ["training", "trainer", "machine-learning", "deep-learning", "ezconfy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "tqdm>=4.66",
    "loguru>=0.7",
]

[project.urls]
Homepage = "https://github.com/alessioarcara/eztrainer"

[project.optional-dependencies]
wandb = ["wandb>=0.17"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-tqdm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eztrainer"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "wandb.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
